  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ea0707, #1d8a2294, #ea0707);

      text-align: center;

    .container {
      padding: 60px 20px;

      font-size: 42px;

    .profile-photo {

      height:150px;

      padding:16px 40px;
      font-size:20px;
      font-weight:bold;
      color:#fff;
      background:linear-gradient(45deg,#ff0080,#ff5db1);
      border:none;
      border-radius:50px;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(0,0,0,0.4);
      transition:0.3s;
    }

    .diamond-btn:hover{
      transform:scale(1.08);
      box-shadow:0 12px 30px rgba(255,0,128,0.6);
    }

    footer {
      margin-top: 60px;
